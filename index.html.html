<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vérificateur de mots de passe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E14; --surface:#121821; --line:#232B36;
    --accent:#39FF88; --weak:#FF5C5C; --mid:#FFC93D;
    --text:#E8ECEF; --text-soft:#8D97A5;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; padding:24px;
  }
  .card{
    width:100%; max-width:440px; background:var(--surface); border:1px solid var(--line);
    border-radius:8px; padding:28px;
  }
  h1{font-family:'JetBrains Mono',monospace; font-size:1.15rem; margin:0 0 6px;}
  .sub{color:var(--text-soft); font-size:0.85rem; margin-bottom:22px;}
  .field{position:relative;}
  input[type=text], input[type=password]{
    width:100%; background:#0D1218; border:1px solid var(--line); color:var(--text);
    font-family:'JetBrains Mono',monospace; font-size:0.95rem; padding:12px 44px 12px 14px;
    border-radius:6px; outline:none;
  }
  input:focus{border-color:var(--accent);}
  .toggle{
    position:absolute; right:10px; top:50%; transform:translateY(-50%);
    background:none; border:none; color:var(--text-soft); cursor:pointer; font-size:0.8rem;
    font-family:'JetBrains Mono',monospace;
  }
  .bar-track{height:8px; background:#1A212B; border-radius:4px; margin:18px 0 8px; overflow:hidden;}
  .bar-fill{height:100%; width:0%; border-radius:4px; transition:width 0.25s ease, background 0.25s ease;}
  .label-row{display:flex; justify-content:space-between; font-family:'JetBrains Mono',monospace; font-size:0.82rem;}
  .label-row #strengthLabel{font-weight:700;}
  ul.checks{list-style:none; margin:20px 0 0; padding:0; font-size:0.85rem;}
  ul.checks li{padding:4px 0; color:var(--text-soft);}
  ul.checks li.ok{color:var(--accent);}
  ul.checks li::before{content:"✕ "; }
  ul.checks li.ok::before{content:"✓ ";}
  .hint{margin-top:18px; font-size:0.8rem; color:var(--text-soft); border-top:1px dashed var(--line); padding-top:14px;}
</style>
</head>
<body>
  <div class="card">
    <h1>&gt; password_checker</h1>
    <div class="sub">Vérifie la solidité de ton mot de passe, localement dans ton navigateur — rien n'est envoyé nulle part.</div>

    <div class="field">
      <input type="password" id="pwd" placeholder="Saisis un mot de passe..." autocomplete="off">
      <button class="toggle" id="toggle">afficher</button>
    </div>

    <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
    <div class="label-row">
      <span>Force</span>
      <span id="strengthLabel">—</span>
    </div>

    <ul class="checks" id="checks">
      <li id="c-len">Au moins 12 caractères</li>
      <li id="c-upper">Une majuscule</li>
      <li id="c-lower">Une minuscule</li>
      <li id="c-digit">Un chiffre</li>
      <li id="c-symbol">Un caractère spécial</li>
    </ul>

    <div class="hint" id="hint">Commence à taper pour voir l'analyse.</div>
  </div>

<script>
  const pwd = document.getElementById('pwd');
  const barFill = document.getElementById('barFill');
  const strengthLabel = document.getElementById('strengthLabel');
  const hint = document.getElementById('hint');
  const toggle = document.getElementById('toggle');

  const checks = {
    len:   v => v.length >= 12,
    upper: v => /[A-Z]/.test(v),
    lower: v => /[a-z]/.test(v),
    digit: v => /[0-9]/.test(v),
    symbol:v => /[^A-Za-z0-9]/.test(v)
  };

  const colors = ['#FF5C5C', '#FF5C5C', '#FFC93D', '#FFC93D', '#39FF88', '#39FF88'];
  const labels = ['Très faible','Faible','Moyen','Correct','Fort','Très fort'];
  const tips = [
    "Commence à taper pour voir l'analyse.",
    "Trop court et trop simple — évite les mots courants.",
    "Ajoute des majuscules, chiffres et symboles.",
    "Pas mal — encore un peu de longueur ou de variété.",
    "Solide. Une longueur supérieure le rendrait encore plus sûr.",
    "Excellent mot de passe. Utilise un gestionnaire pour ne pas avoir à le retenir."
  ];

  pwd.addEventListener('input', () => {
    const v = pwd.value;
    let score = 0;
    for (const key in checks){
      const pass = checks[key](v);
      const li = document.getElementById('c-' + key);
      li.classList.toggle('ok', pass);
      if (pass) score++;
    }
    if (v.length === 0){ score = 0; }
    const pct = (score/5)*100;
    barFill.style.width = pct + '%';
    barFill.style.background = colors[score];
    strengthLabel.textContent = labels[score];
    strengthLabel.style.color = colors[score];
    hint.textContent = tips[score];
  });

  toggle.addEventListener('click', () => {
    const isPwd = pwd.type === 'password';
    pwd.type = isPwd ? 'text' : 'password';
    toggle.textContent = isPwd ? 'masquer' : 'afficher';
  });
</script>
</body>
</html>
